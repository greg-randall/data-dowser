# Data Patches for Water Quality Data
# Used to correct known data-entry errors in source TCEQ reports.
# "action" can be a number (to replace the value) or "drop" (to skip the row).

- system_id: "TX0750044"
  year: 2016
  contaminant: "Arsenic"
  action: 22.0
  note: >
    The original report listed 45,262 ppb—an extreme outlier that is thousands of times 
    beyond the legal limit and far exceeds levels associated with acute toxicity. 
    Surrounding years show ~20 ppb, indicating a massive data-entry typo. 
    We capped this at 22 ppb to preserve the violation signal while removing the impossible spike.

- system_id: "TX1820001"
  year: 2020
  contaminant: "Chlorite"
  action: 0.705
  note: >
    The source report lists 705 ppm, but also marks 'Violation: N'. 
    Since the limit is 1.0 ppm, 705 is physically impossible for drinking water. 
    This is a common unit error where 705 ppb (0.705 ppm) was entered as ppm.

